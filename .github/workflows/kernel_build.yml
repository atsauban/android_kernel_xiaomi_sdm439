name: Build SDM439 Kernel

on:
  push:
    branches:
      - a12/main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device'
        required: true
        default: 'olive'
        type: choice
        options:
          - 'olive'
          - 'pine'
      defconfig:
        description: 'Defconfig Name'
        required: true
        default: 'olive-perf_defconfig'
        type: choice
        options:
          - 'olive-perf_defconfig'
          - 'olive_defconfig'
          - 'pine-perf_defconfig'

jobs:
  build:
    name: Compile Kernel (${{ inputs.device || 'olive' }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev ccache zip zstd \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            build-essential libncurses5-dev libncurses-dev ca-certificates curl git \
            python3 python-is-python3

      - name: Setup Proton Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' AnyKernel3/anykernel.sh

      - name: Build Kernel Image
        id: compile
        run: |
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KBUILD_BUILD_USER="atsauban"
          export KBUILD_BUILD_HOST="github-actions"

          DEFCONFIG="${{ inputs.defconfig || 'olive-perf_defconfig' }}"
          DEVICE="${{ inputs.device || 'olive' }}"
          mkdir -p out

          echo "Configuring kernel with $DEFCONFIG..."
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG

          echo "Compiling kernel..."
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc --all)

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Image.gz-dtb found, copying..."
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Image.gz found, copying..."
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            echo "dtbo.img found, copying..."
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          if [ ! -f "AnyKernel3/Image.gz-dtb" ] && [ ! -f "AnyKernel3/Image.gz" ]; then
            echo "::error::Kernel image not found after build!"
            exit 1
          fi

          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="NetHunter-Kernel-SDM439-${DEVICE}-${BUILD_DATE}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          cd ..
          echo "ZIP_PATH=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.compile.outputs.ZIP_PATH }}
          path: ${{ steps.compile.outputs.ZIP_PATH }}
          retention-days: 14
